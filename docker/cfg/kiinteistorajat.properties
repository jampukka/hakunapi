# Tiles test bench, cadastral boundaries from a GeoPackage.
#
# 20.5 M LINESTRINGs in 5 GB, native EPSG:3067, R-tree indexed. Two things this
# exercises that the addresses bench does not:
#
#   - a non-PostGIS source. The tile path goes through
#     FeatureType.getFeatureProducer() exactly as /items does, so a GeoPackage
#     collection serves tiles with no tiles-side change at all.
#   - line geometry. Addresses are points, which never clip; a dense boundary
#     network makes MvtLineGeometryWriter's clipping and simplification the work
#     rather than an untaken branch.
#
# The .gpkg is not in the repo. Bind-mount it and point db= at it:
#   docker compose -f docker-compose-tiles-gpkg.yml up

api.title=Cadastral boundaries, Finland
api.version=0.1
api.description=Tiles test bench over a GeoPackage source. Cadastral boundary geometry (kiinteistorajat) from the National Land Survey of Finland.
api.license.name=CC BY 4.0
api.license.url=https://creativecommons.org/licenses/by/4.0/

servers=dev
servers.dev.url=http://localhost:8080/features
servers.dev.description=Development server

formats=json,html
formats.json.type=json
formats.html.type=html
formats.html.3067.tileUrl=https://avoin-karttakuva.maanmittauslaitos.fi/avoin/wmts/1.0.0/taustakartta/default/ETRS-TM35FIN/{z}/{y}/{x}.png?api-key=7cd2ddae-9f2e-481c-99d0-404e7bc7a0b2
formats.html.3067.tileAttribution=&copy; <a href="https://www.nls.fi">National Land Survey of Finland</a>
formats.html.3067.tileOriginX=-548576
formats.html.3067.tileOriginY=8388608

getfeatures.limit.default=10
getfeatures.limit.max=10000

srid=3067,4258
srid.3067.latLon=false
srid.4258.latLon=true

# Only the GeoPackage driver: no PostGIS on the classpath path at all, which is
# the point of this configuration.
db.classes=fi.nls.hakunapi.source.gpkg.GpkgSimpleSource

collections=kiinteistorajat

collections.kiinteistorajat.title=Cadastral boundaries
collections.kiinteistorajat.description=Boundary geometry of Finnish cadastral parcels.
collections.kiinteistorajat.db=kiinteistorajat.gpkg
collections.kiinteistorajat.table=KiinteistorajanSijaintitiedot
collections.kiinteistorajat.srid=3067,4258
collections.kiinteistorajat.writeNulls=true

collections.kiinteistorajat.id=fid
collections.kiinteistorajat.geometry=geom

collections.kiinteistorajat.properties=kiinteistorajalaji,lahdeaineisto,interpolointitapa

# --- tiles ------------------------------------------------------------------

tiles.layers=kiinteistorajat
tiles.layers.kiinteistorajat.vectortile.collections=kiinteistorajat

default.tiles.layers.vectortile.generator=hakunapi

tileMatrixSets=ETRS-TM35FIN
tileMatrixSets.ETRS-TM35FIN.title=ETRS-TM35FIN (JHS 180)
tileMatrixSets.ETRS-TM35FIN.srid=3067
tileMatrixSets.ETRS-TM35FIN.bbox=-548576,6291456,1548576,8388608
tileMatrixSets.ETRS-TM35FIN.resolutions=8192,4096,2048,1024,512,256,128,64,32,16,8,4,2,1,0.5,0.25

default.tiles.layers.tileMatrixSets=WebMercatorQuad,ETRS-TM35FIN
