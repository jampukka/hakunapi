# Cloud-native Maastotietokanta: a 52 GB GeoPackage read over HTTP Range
# requests, never downloaded.
#
# This is the case the module exists for. The .gpkg does not fit in an image and
# there is no point copying it anywhere, so it stays in object storage (nginx in
# the compose file, an S3 URL in production) and hakunapi reads the pages it
# needs. SQLite's own query planner picks the rtree spatial index, so a bbox
# query over the whole of Finland fetches hundreds of kilobytes.
#
# Collection blocks are taken verbatim from the tiles bench config
# (mtkmaasto-subset.properties) so the two are comparable; only the source
# differs. Requires JDK 22+ and libsqlite3 with SQLITE_ENABLE_RTREE.
#
# Two benches read this file, and the tiles block at the bottom is why it works
# for both: the reference webapp bundles no tiles modules, so those keys are
# simply unread there.
#
#   features only, reference webapp:
#     GPKG_DIR=$HOME/data docker compose -f docker-compose-gpkg-http.yml up --build
#   features and vector tiles, tiles test bench:
#     GPKG_DIR=$HOME/data docker compose -f docker-compose-tiles-mtk-http.yml up --build

api.title=Maastotietokanta, Finland (over HTTP Range)
api.version=0.1
api.description=OGC API - Features over the National Land Survey of Finland's topographic database, read straight from object storage with a SQLite VFS implemented in Java.
api.license.name=CC BY 4.0
api.license.url=https://creativecommons.org/licenses/by/4.0/

servers=dev
servers.dev.url=http://localhost:8080/features
servers.dev.description=Development server

formats=json,html
formats.json.type=json
formats.html.type=html
formats.html.3067.tileUrl=https://avoin-karttakuva.maanmittauslaitos.fi/avoin/wmts/1.0.0/taustakartta/default/ETRS-TM35FIN/{z}/{y}/{x}.png?api-key=7cd2ddae-9f2e-481c-99d0-404e7bc7a0b2
formats.html.3067.tileAttribution=&copy; <a href="https://www.nls.fi">National Land Survey of Finland</a>
formats.html.3067.tileOriginX=-548576
formats.html.3067.tileOriginY=8388608

getfeatures.limit.default=10
getfeatures.limit.max=10000

srid=3067,4258
srid.3067.latLon=false
srid.4258.latLon=true

db.classes=fi.nls.hakunapi.source.gpkg.http.GpkgHttpSimpleSource

# The remote GeoPackage, as a URL to the file itself - HttpRangeReader issues a
# HEAD against exactly this address, so it is not a bucket root.
#
# The compose bench serves it from the nginx 'storage' service:
#   db.mtk.url=http://storage/mtkmaasto.gpkg
db.mtk.url=https://qhm3q.upcloudobjects.com/mtk/mtkmaasto.gpkg

# Both cache settings below are required: the block cache is the only cache in
# this stack, so there is no size the source can pick on the operator's behalf.
# The values are what a 49 GB MTK GeoPackage in object storage wanted on a
# 1 GB / 1 vCPU host.
#
# What the numbers came from. One 31-collection z14 tile reads a few hundred
# distinct places in the file - 31 rtree descents, each landing somewhere
# unrelated to the others - and those reads are scattered rather than
# sequential: of 218 blocks one tile fetched, 86 were single blocks with no
# neighbour, and only 3 runs reached 6 blocks. So read-ahead has little to
# work with here, and what decides whether the cache helps is how many blocks
# it can hold, not how big they are. Measured hits per fetch: 4 KiB blocks 1.0,
# 64 KiB 3.2, 128 KiB 4.5 - the bigger blocks do fetch fewer times, but in a
# fixed 128 MB they hold so few blocks that a second look at the same view
# evicted what it needed. Small blocks and many of them won.
#
# The number to watch is "blocks held" in the log line. If it sits at the
# maximum, the cache is evicting blocks the next tile is about to read.
#
# Read through blocks of this size instead of one Range request per page. Worth
# it when a round trip is expensive: a Range request to object storage measured
# ~200 ms whether it asked for 4 KiB or 512 KiB, against ~70 us to nginx on the
# same host.
db.mtk.blockSizeKb=4

# How much the block cache may hold, on the Java heap. 65536 / 4 = 16384 blocks.
# Measured on the bench server: 6796 blocks held with no eviction, so this has
# room to spare. It is the memory ceiling of the source - one shared cache, not
# one per request - and a third of a 192 MB heap, which is why it is not larger.
#
# SQLite's own page cache is off (PRAGMA cache_size = 0): a cache on the handle
# would hold the same bytes a second time, once per handle, and a handle is
# opened and closed per connection.
db.mtk.blockCacheKb=65536

# Project with proj-jhe rather than GeoTools, which this bench's war does not
# carry - see hakunapi-tiles-testbench-jakarta/pom.xml. It has to be repeated per
# collection: HakunaConfigParser.getProjection reads collections.<id>.proj only,
# with no default.collections.proj fallback, and it logs a warning and returns
# null on a class it cannot load rather than failing startup - so a missing key
# here surfaces as "Coordinate reference system not supported" on the first tile.
#
# proj-jhe covers EPSG:3067 and 3857 (both tile matrix sets), 3046-3048,
# 3873-3885 and 4258/4326 as the geodetic end.

collections=tieviiva,rautatie,lentokenttaalue,vesikulkuvayla,autoliikennealue,jarvi,meri,virtavesialue,virtavesikapea,allas,vesikivi,suo,kallioalue,hietikko,kivikko,soistuma,niitty,muuavoinalue,metsamaankasvillisuus,jyrkanne,kivi,maastokuvionreuna,maatalousmaa,puisto,hautausmaa,urheilujavirkistysalue,taajaanrakennettualue,maaaineksenottoalue,rakennus,paikannimi,kunnanhallintoraja

