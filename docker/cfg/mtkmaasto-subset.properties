# MTK (Maastotietokanta) vector tiles from a GeoPackage.
#
# Thirty-one collections out of the 121 in the .gpkg - the tables the style
# leans on. Past these the remaining tables get progressively rarer, so this is
# close to the whole of what a background map draws.
# Native EPSG:3067, every table R-tree indexed. The dataset tileset at /tiles
# serves ONE tile carrying one MVT layer per collection, which is what a vector
# tile style consumes; /tiles/{tileMatrixSetId}/tilejson.json describes it for a
# MapLibre style.
#
# The collection blocks are generated from the .gpkg schema, not hand-written.
# The *viittaus columns (internal cross-references between MTK tables) are left
# out: no style uses them and every attribute is bytes in every tile.
#
# The .gpkg is not in the repo. Bind-mount it and point db= at it:
#   GPKG_DIR=$HOME/data docker compose -f docker-compose-tiles-mtk.yml up

api.title=Maastotietokanta, Finland (subset)
api.version=0.1
api.description=OGC API - Features and Tiles over the main collections of the National Land Survey of Finland's topographic database (Maastotietokanta).
api.license.name=CC BY 4.0
api.license.url=https://creativecommons.org/licenses/by/4.0/

servers=dev
servers.dev.url=http://localhost:8080/features
servers.dev.description=Development server

formats=json,html
formats.json.type=json
formats.html.type=html
formats.html.3067.tileUrl=https://avoin-karttakuva.maanmittauslaitos.fi/avoin/wmts/1.0.0/taustakartta/default/ETRS-TM35FIN/{z}/{y}/{x}.png?api-key=7cd2ddae-9f2e-481c-99d0-404e7bc7a0b2
formats.html.3067.tileAttribution=&copy; <a href="https://www.nls.fi">National Land Survey of Finland</a>
formats.html.3067.tileOriginX=-548576
