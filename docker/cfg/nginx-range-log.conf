# The Range file server of docker-compose-gpkg-http.yml, plus an access log
# shaped for counting what a tile actually fetches.
#
# The tiles bench exists to measure a request that touches 31 collections at
# once, and the number that explains its latency is not in hakunapi: it is the
# count of Range requests SQLite issues and the bytes they carry. The default
# combined format logs neither the requested range nor the body size in a form
# that is easy to sum, so this format logs both, one line per request.
#
# Fields: <range header> <status> <bytes sent> <request time>
log_format range '$http_range $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    autoindex on;

    access_log /var/log/nginx/range.log range;

    # Range requests are what the VFS relies on. nginx sets Accept-Ranges on
    # static files itself; this just makes it explicit that nothing may buffer
    # or transform the response.
    location / {
        add_header Accept-Ranges bytes always;
        gzip off;
    }
}
