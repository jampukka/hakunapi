# Static file server for the GeoPackage. nginx supports Range requests on
# static files out of the box; autoindex is on so the file listing can be
# checked from a browser.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    autoindex on;

    # Range requests are what the VFS relies on. nginx sets Accept-Ranges on
    # static files itself; this just makes it explicit that nothing may buffer
    # or transform the response.
    location / {
        add_header Accept-Ranges bytes always;
        gzip off;
    }
}
