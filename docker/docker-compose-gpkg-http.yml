# Maastotietokanta over HTTP Range: a 52 GB GeoPackage read straight from
# object storage, never downloaded.
#
# The .gpkg is bind-mounted into nginx only. The hakunapi container never sees
# the file - it gets a URL, and SQLite pulls the pages it needs through a VFS
# implemented in Java. That is the whole point: the dataset does not have to fit
# anywhere near the server.
#
# The .gpkg is not in the repo (52 GB). Point GPKG_DIR at the directory holding
# mtkmaasto.gpkg:
#
#   GPKG_DIR=$HOME/data docker compose -f docker-compose-gpkg-http.yml up --build
#
# Then http://localhost:8080/features/
name: hakunapi-gpkg-http

services:
  storage:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ${GPKG_DIR:-/home/janne/data}/mtkmaasto.gpkg:/usr/share/nginx/html/mtkmaasto.gpkg:ro
      - ./cfg/nginx-range.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Exposed so the same Range requests can be tried from the host with curl
      - "8081:80"
    healthcheck:
      # A HEAD, which is enough to prove the file is served without streaming
      # 52 GB. Neither wget form works here: --spider still issues a GET, and
      # busybox wget treats a 206 as an error.
      test: [ "CMD-SHELL", "nc -z localhost 80 && wget -q -O /dev/null --header='Range: bytes=0-0' http://localhost/mtkmaasto.gpkg 2>&1 | grep -q '206 Partial Content'" ]
      interval: 5s
      retries: 5
      timeout: 5s

  hakunapi:
    build:
      context: ../.
      dockerfile: Dockerfile.gpkg-http
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "41469:41469"
    volumes:
      # Only the config: the data is remote, which is the point
      - ./cfg/mtkmaasto-http.properties:/app/config/mtkmaasto-http.properties:ro
    environment:
      CATALINA_OPTS: >-
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:41469
        -Dfeatures.hakuna.config.path=/app/config/mtkmaasto-http.properties
        --enable-native-access=ALL-UNNAMED
    depends_on:
      storage:
        condition: service_healthy
