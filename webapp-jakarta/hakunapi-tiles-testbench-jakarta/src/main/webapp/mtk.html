<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hakunapi tiles test bench — MTK on OpenLayers</title>
<link rel="stylesheet" href="https://unpkg.com/ol@10.2.1/ol.css">
<style>
    html, body { margin: 0; height: 100%; }
    #map { position: absolute; inset: 0; background: #fff; }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/ol@10.2.1/dist/ol.js"></script>
<script src="https://unpkg.com/ol-mapbox-style@12.3.5/dist/olms.js"></script>
<script>
// ol-mapbox-style applies a Mapbox/MapLibre style document to an OpenLayers map
// directly, so the bench needs no per-layer wiring of its own. mtk-maplibre.html
// draws the same style on MapLibre GL for comparison, and mtk-tm35.html draws it
// on the native EPSG:3067 scheme - the tile path that does not reproject.
var API = location.origin + location.pathname.replace(/\/[^/]*$/, '');

fetch('mtk-style.json')
    .then(function (r) { return r.json(); })
    .then(function (style) {
        style.sources.taustakartta = {
            type: 'vector',
            url: API + '/tiles/WebMercatorQuad/tilejson.json'
        };
        return olms.apply(new ol.Map({ target: 'map' }), style);
    })
    .catch(function (e) { console.error('style load failed:', e); });
</script>
</body>
</html>
